name: docker-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build -t kotlin-stakeholder .
      - run: docker run --rm kotlin-stakeholder --list-values | grep '"generatorFamilies"'
      - run: docker run --rm kotlin-stakeholder --focus-family code_analyzer --output-format json --seed smoke | grep '"family":"code_analyzer"'
      - run: docker run --rm kotlin-stakeholder --focus-family delivery_preview_ops --output-format json --seed smoke | grep '"family":"delivery_preview_ops"'
      - run: |
          if docker run --rm kotlin-stakeholder --experimental-provider openai >/tmp/provider.out 2>/tmp/provider.err; then
            echo "experimental-provider unexpectedly succeeded" >&2
            exit 1
          fi
          grep 'experimental-provider is not implemented yet in kotlin-stakeholder' /tmp/provider.err
